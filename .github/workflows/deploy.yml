name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test report engine
        run: npm run test:report

      - name: Test compatibility report
        run: npm run test:compatibility

      - name: Test checkout versioning
        run: npm run test:checkout

      - name: Test content calendar
        run: npm run test:content

      - name: Test IndexNow key
        run: npm run test:indexnow

      - name: Validate report Worker bundle
        run: npx wrangler deploy --config wrangler.report-worker.jsonc --dry-run
      
      - name: Build
        run: npm run build

      - name: Check static export redirects
        run: npm run test:export
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=mayanastrologycalculator --commit-dirty=true

      # Best-effort ping after a successful deploy. A failed IndexNow submit
      # does not fail the deploy. Search Console ownership is still manual.
      - name: Submit sitemap URLs to IndexNow (non-blocking)
        continue-on-error: true
        run: npm run indexnow
        env:
          SITE_ORIGIN: https://mayanastrologycalculator.com
